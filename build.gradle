plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		name = "Xander"
		url = "https://maven.isxander.dev/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"chat-translator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

sourceSets {
	clientTest {
		java {
			srcDirs = ['src/client/test/java']
		}
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Chat Translator: ML inference stack
	// These are ordinary Maven libraries, not Fabric mods, so players won't have them
	// installed separately — include(...) bundles each as a nested jar inside our own
	// mod jar (Fabric Loom's "jar-in-jar"), which Fabric Loader extracts onto the
	// classpath at launch. Without this, `implementation`/`runtimeOnly` alone only
	// works in the dev environment (Gradle assembles the full classpath for
	// `runClient`) and throws NoClassDefFoundError in a real installed instance.
	implementation include("ai.djl:api:${project.djl_version}")
	runtimeOnly include("ai.djl.onnxruntime:onnxruntime-engine:${project.djl_version}")
	// include(...) does not pull in transitive dependencies of what it's given, so the
	// actual native ONNX Runtime binaries (a separate artifact from the thin DJL engine
	// wrapper above) must be included explicitly too, or inference fails at runtime
	// with UnsatisfiedLinkError despite the engine wrapper class loading fine.
	// stripOnnxDebugSymbols below drops the macOS debug symbols back out of this one.
	runtimeOnly include("com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}")
	implementation include("ai.djl.huggingface:tokenizers:${project.djl_version}")
	implementation include("com.github.pemistahl:lingua:${project.lingua_version}")
	// Lingua is written in Kotlin and uses Moshi/Okio for its bundled language-model
	// JSON data — none of these are provided by Minecraft/Fabric's own dependencies
	// (unlike e.g. gson, jna, fastutil, commons-io, which the game already bundles and
	// don't need to be duplicated here), so they must be included explicitly too.
	implementation include("org.jetbrains.kotlin:kotlin-stdlib:1.6.21")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-common:1.6.21")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.6.0")
	implementation include("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.6.0")
	implementation include("org.jetbrains.kotlin:kotlin-reflect:1.6.0")
	implementation include("org.jetbrains:annotations:13.0")
	implementation include("com.squareup.moshi:moshi:1.13.0")
	implementation include("com.squareup.moshi:moshi-kotlin:1.13.0")
	implementation include("com.squareup.okio:okio:3.4.0")
	// Script → Latin romanization for outgoing chat on English-only servers
	implementation include("com.ibm.icu:icu4j:${project.icu4j_version}")

	// Optional Mod Menu config button (not required at runtime for players).
	// compileOnly so the jar does not hard-depend; localRuntime so runClient can open it.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// YACL is optional at runtime (see fabric.mod.json "recommends"): ModMenuIntegration
	// only touches ChatTranslatorConfigScreen when the mod is loaded, so a player can
	// install this jar alone and configure everything through /translate commands.
	compileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
	localRuntime "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	clientTestImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	clientTestRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.register('clientTest', Test) {
	description = 'Runs unit tests for pure client-side logic.'
	group = 'verification'
	testClassesDirs = sourceSets.clientTest.output.classesDirs
	classpath = sourceSets.clientTest.runtimeClasspath
	useJUnitPlatform()
	// Lingua's LanguageDetectorBuilder.fromAllLanguages() loads n-gram models for
	// every supported language; the default forked test JVM heap is too small for that.
	maxHeapSize = '2g'
}

tasks.named('check') {
	dependsOn 'clientTest'
}

// The published onnxruntime jar carries .dSYM debug symbols for its macOS natives:
// ~31 MB compressed of lldb data that nothing reads at runtime, shipped to every
// player on every platform. Loom will only nest a real module component, so the
// symbols are stripped out of the nested jar after the final jar is assembled
// rather than by repackaging the dependency beforehand.
tasks.register('stripOnnxDebugSymbols') {
	description = 'Removes macOS debug symbols from the nested onnxruntime jar.'
	group = 'build'

	// Loom's remap task is not addressable by name here, so this hangs off assemble
	// and locates the finished jar by path instead.
	doLast {
		def outerJar = layout.buildDirectory
				.file("libs/${project.name}-${project.version}.jar").get().asFile
		if (!outerJar.exists()) {
			throw new GradleException("Expected a built jar at ${outerJar}")
		}
		def rewritten = new File(outerJar.parentFile, outerJar.name + ".stripping")
		def before = outerJar.length()
		def strippedAny = false
		def marker = 'META-INF/onnx-symbols-stripped'

		// assemble can run again over an already-stripped jar (an up-to-date build,
		// or a second invocation). The marker distinguishes that from an upstream
		// artifact that has stopped shipping symbols, which should be noticed.
		def alreadyStripped = new java.util.zip.ZipFile(outerJar).withCloseable {
			it.getEntry(marker) != null
		}
		if (alreadyStripped) {
			logger.info('ONNX debug symbols already stripped')
			return
		}

		new java.util.zip.ZipFile(outerJar).withCloseable { outer ->
			new java.util.zip.ZipOutputStream(rewritten.newOutputStream()).withStream { out ->
				outer.entries().each { entry ->
					if (!(entry.name ==~ /META-INF\/jars\/onnxruntime-[^\/]+\.jar/)) {
						out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
						if (!entry.directory) {
							outer.getInputStream(entry).withStream { it.transferTo(out) }
						}
						out.closeEntry()
						return
					}

					// Rewrite the nested jar through a temp file: holding a ~130 MB
					// archive in memory would blow the build JVM's heap.
					def slim = File.createTempFile("onnxruntime-slim", ".jar")
					try {
						new java.util.zip.ZipOutputStream(slim.newOutputStream()).withStream { nestedOut ->
							outer.getInputStream(entry).withStream { raw ->
								def nestedIn = new java.util.zip.ZipInputStream(raw)
								def nested
								while ((nested = nestedIn.nextEntry) != null) {
									if (nested.name.contains('.dSYM/')) {
										strippedAny = true
										continue
									}
									nestedOut.putNextEntry(new java.util.zip.ZipEntry(nested.name))
									nestedIn.transferTo(nestedOut)
									nestedOut.closeEntry()
								}
							}
						}
						out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
						slim.withInputStream { it.transferTo(out) }
						out.closeEntry()
					} finally {
						slim.delete()
					}
				}

				out.putNextEntry(new java.util.zip.ZipEntry(marker))
				out.closeEntry()
			}
		}

		if (!strippedAny) {
			// Better to fail than to silently ship the symbols again if the upstream
			// artifact ever stops carrying them under this path.
			rewritten.delete()
			throw new GradleException("No .dSYM entries found in the nested onnxruntime jar")
		}

		rewritten.renameTo(outerJar)
		logger.lifecycle(String.format(
				"Stripped ONNX debug symbols: %.1f MB -> %.1f MB",
				before / 1048576.0, outerJar.length() / 1048576.0))
	}
}

tasks.named('assemble') {
	finalizedBy 'stripOnnxDebugSymbols'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
